<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A's Restaurant</title>

    <style>
        body {
            background-color: #3815A1;
            font-family: Arial, sans-serif;
            margin: 0;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: auto;
            background: white;
            padding: 20px;
            box-sizing: border-box;
        }

        .header {
            margin-bottom: 20px;
            text-align: center;
        }

        .logo {
            width: 200px;
            height: 200px;
            margin: auto;
        }

        .logo img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .menu {
            text-align: center;
            margin-top: 20px;
            margin-bottom: 30px;
        }

        .menu a {
            background: #040C1C;
            color: white;
            padding: 10px 20px;
            margin: 5px;
            display: inline-block;
            text-decoration: none;
        }

        .menu a:hover {
            background: #1c2d57;
        }

        .footer {
            background: #040C1C;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <div class="logo">
                <img src="images/logo.jpg" alt="Restaurant Logo">
            </div>
            <h1>A's Restaurant</h1>
        </div>

        <div class="menu">
            <a href="#">Home</a>
            <a href="#">Products</a>
            <a href="#">Gallery</a>
            <a href="#">Customer Feedback</a>
        </div>

        <div class="footer">
            <p>A's Website</p>
        </div>

    </div>

</body>
</html>
