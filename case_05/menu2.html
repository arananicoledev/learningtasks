<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A's Restaurant</title>

    <style>
        body {
            background-color: #3815A1;
            font-family: Arial, sans-serif;
            margin: 0;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: auto;
            background: grey;
            padding: 20px;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo {
            width: 200px;
            height: 200px;
            margin: auto;
        }

        .logo img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .menu {
            background: #040C1C;
            text-align: center;
            padding: 15px;
            margin-bottom: 20px;
        }

        .menu a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-size: 18px;
        }

        .menu a:hover {
            color: yellow;
        }

        .items {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }

        .box {
            width: 250px;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            text-align: center;
            padding: 10px;
        }

        .box img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .box p {
            background: #040C1C;
            color: white;
            font-family: "Times New Roman", serif;
            font-size: 24px;
            padding: 10px;
            margin: 10px 0 0;
            border-radius: 4px;
        }

        .footer {
            text-align: center;
            background: #040C1C;
            color: white;
            padding: 15px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="logo">
            <img src="images/logo.jpg" alt="Logo">
        </div>
        <h1>A's Restaurant</h1>
    </div>

    <div class="menu">
        <a href="#">Home</a>
        <a href="#">Products</a>
        <a href="#">Gallery</a>
        <a href="#">Customer Feedback</a>
    </div>

    <div class="items">

        <div class="box">
            <img src="images/lumpia.jpg" alt="Lumpia">
            <p>Lumpia</p>
        </div>

        <div class="box">
            <img src="images/palabok.jpg" alt="Pancit Palabok">
            <p>Pancit Palabok</p>
        </div>

        <div class="box">
            <img src="images/calamares.jpg" alt="Calamares">
            <p>Calamares</p>
        </div>

        <div class="box">
            <img src="images/kinilaw.jpg" alt="Kinilaw">
            <p>Kinilaw</p>
        </div>

        <div class="box">
            <img src="images/kare.jpg" alt="Kare-Kare">
            <p>Kare-Kare</p>
        </div>

        <div class="box">
            <img src="images/pata.jpg" alt="Crispy Pata">
            <p>Crispy Pata</p>
        </div>

    </div>

    <div class="footer">
        <p>A's Restaurant Website</p>
    </div>

</div>

</body>
</html>
